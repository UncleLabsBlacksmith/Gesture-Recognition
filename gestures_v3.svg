<svg width="100%" viewBox="0 0 680 480" role="img"><title>Hand gestures for AI Virtual Mouse 3.0</title><desc>Seven gestures: point, pinch, middle pinch, two fingers, thumb up, fist, open palm</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect x="40" y="30" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="109" y="50" text-anchor="middle">Point</text><rect x="79" y="140" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="130" y1="142" x2="130" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="102" y1="142" x2="102" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="116" y1="142" x2="116" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="88" y1="142" x2="88" y2="85" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="86" y1="170" x2="102" y2="160" stroke="#888780" stroke-width="11" stroke-linecap="round"/><text class="ts" x="109" y="214" text-anchor="middle">Move cursor</text></g><g><rect x="194" y="30" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="263" y="50" text-anchor="middle">Pinch</text><rect x="233" y="140" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="284" y1="142" x2="284" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="256" y1="142" x2="256" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="270" y1="142" x2="270" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="242" y1="142" x2="242" y2="85" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="224" y1="180" x2="232" y2="92" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><circle cx="234" cy="86" r="9" fill="none" stroke="#EF9F27" stroke-width="2"/><text class="ts" x="263" y="214" text-anchor="middle">Click / hold = drag</text></g><g><rect x="348" y="30" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="417" y="50" text-anchor="middle">Pinch middle</text><rect x="387" y="140" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="438" y1="142" x2="438" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="410" y1="142" x2="410" y2="79" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="424" y1="142" x2="424" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="396" y1="142" x2="396" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="378" y1="180" x2="400" y2="92" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><circle cx="404" cy="86" r="9" fill="none" stroke="#EF9F27" stroke-width="2"/><text class="ts" x="417" y="214" text-anchor="middle">Right click</text></g><g><rect x="502" y="30" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="571" y="50" text-anchor="middle">Two fingers</text><rect x="541" y="140" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="592" y1="142" x2="592" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="564" y1="142" x2="564" y2="79" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="578" y1="142" x2="578" y2="130" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="550" y1="142" x2="550" y2="85" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="548" y1="170" x2="564" y2="160" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="622" y1="125" x2="622" y2="90" class="arr" stroke="#1D9E75" marker-end="url(#arrow)"/><line x1="622" y1="130" x2="622" y2="165" class="arr" stroke="#1D9E75" marker-end="url(#arrow)"/><text class="ts" x="571" y="214" text-anchor="middle">Move up/down = scroll</text></g><g><rect x="117" y="250" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="186" y="270" text-anchor="middle">Thumb up</text><rect x="156" y="360" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="207" y1="362" x2="207" y2="350" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="179" y1="362" x2="179" y2="350" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="193" y1="362" x2="193" y2="350" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="165" y1="362" x2="165" y2="350" stroke="#888780" stroke-width="11" stroke-linecap="round"/><line x1="161" y1="375" x2="147" y2="312" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><text class="ts" x="186" y="434" text-anchor="middle">Enter</text></g><g><rect x="271" y="250" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="340" y="270" text-anchor="middle">Fist</text><rect x="310" y="360" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="361" y1="362" x2="361" y2="350" stroke="#E24B4A" stroke-width="11" stroke-linecap="round"/><line x1="333" y1="362" x2="333" y2="350" stroke="#E24B4A" stroke-width="11" stroke-linecap="round"/><line x1="347" y1="362" x2="347" y2="350" stroke="#E24B4A" stroke-width="11" stroke-linecap="round"/><line x1="319" y1="362" x2="319" y2="350" stroke="#E24B4A" stroke-width="11" stroke-linecap="round"/><line x1="317" y1="390" x2="333" y2="380" stroke="#888780" stroke-width="11" stroke-linecap="round"/><text class="ts" x="340" y="434" text-anchor="middle">Hold 0.8 s = pause</text></g><g><rect x="425" y="250" width="138" height="200" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5"/><text class="th" x="494" y="270" text-anchor="middle">Open palm</text><rect x="464" y="360" width="60" height="50" rx="12" class="box" stroke-width="0.5"/><line x1="515" y1="362" x2="515" y2="315" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="487" y1="362" x2="487" y2="299" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="501" y1="362" x2="501" y2="305" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="473" y1="362" x2="473" y2="305" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><line x1="463" y1="390" x2="439" y2="362" stroke="#1D9E75" stroke-width="11" stroke-linecap="round"/><text class="ts" x="494" y="434" text-anchor="middle">Hold 0.6 s = resume</text></g></svg>